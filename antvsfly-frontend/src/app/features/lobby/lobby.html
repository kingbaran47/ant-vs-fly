<div>

<div class="flex flex-row justify-between items-center w-full px-6">

<div class="w-20"></div>

<h1 class="text-3xl font-bold text-white mb-3 mt-10 text-center">
    Lobby {{roomCode()}}
</h1>

<button class="cyber-btn px-8 py-3 mt-8 "
    (click)="leaveGame()"
>
    <span class="inline-block skew-x-12 text-cyan-400 
                 font-bold tracking-widest font-mono
                 transition-all hover:text-cyan-300">
        LEAVE
    </span>
</button>

</div>



</div>



<div class="flex flex-row  justify-between flex-1 mt-20">

   
    <div class="flex flex-col  items-center justify-center w-1/2">
        <img [src]="'images/' + opponentCharacter() + '-svgrepo-com.svg'" class="w-64 h-64 mb-0">
        <p class="text-red-500 text-3xl">{{opponent()}}</p>
    
        @if(isHost() && players().length === 2) {
            
            <button 
                type="button"
                (click)="kickPlayer()"
                class="text-white border p-1 rounded-lg"> Kick </button>

            
        }
        
    </div>


    <div class="flex items-center">
        
        @if (isHost() && players().length === 2) {
            <button class="cyber-btn cyber-btn-gold px-20 py-10 mt-8 "
    (click)="startTheGame()"
>
    <span class="inline-block skew-x-1s text-yellow-400 
                 font-bold tracking-widest font-mono
                 transition-all hover:text-yellow-400">
        START
 
    </span>
</button>
        } @else if (isHost() && players().length < 2) {
            <div class="wave-container flex flex-col items-center justify-center gap-4 space-y-2">
            <h1 class="wave-text">
            <span>Waiting</span>  <span>for</span>  <span>your</span><span>Enemy</span>
    </h1>
</div>
        } 
        @if (!isHost()) {
             
              <div class="wave-container flex flex-col items-center justify-center gap-4 space-y-2">
            <h1 class="wave-text">
            <span>Waiting</span>  <span>for</span>  <span>Host</span>
    </h1>
</div>
        }


        
       
    
    
    </div>

   
    <div class="flex flex-col  items-center justify-center w-1/2">
        <img [src]="'images/' + myCharacter() + '-svgrepo-com.svg'" class="w-64 h-64 mb-0">
        <p class="text-white text-3xl">{{playerName()}}</p>
        <p class="text-white">You</p>
    </div>
    




</div>


</main>
