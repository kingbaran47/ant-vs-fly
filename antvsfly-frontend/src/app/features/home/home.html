<main class="relative min-h-screen bg-gray-900 flex flex-col items-center justify-center overflow-hidden px-4">

    <!-- Ameise links -->
<img
    src="images/homeant.png"
    class="absolute bottom-0 h-3/4 pointer-events-none object-cover transition-opacity duration-300"
    [style.opacity]="selectedCharacter === 'fly' ? '0.15' : selectedCharacter === 'ant' ? '0.9' : '0.4'"
    style="transform: scaleX(-1); left: -10%;"
/>

<!-- Asche & Glut — steigt von unten nach oben -->

<div class="ember" style="left:77%; bottom:0; --drift: 20px;  --rise: -90vh;  --size: 5px; --color: #f97316; --dur: 2.6s; animation-delay: 0.6s;"></div>
<div class="ember" style="left:89%; bottom:0; --drift: -23px; --rise: -80vh;  --size: 3px; --color: #ef4444; --dur: 3.7s; animation-delay: 1.1s;"></div>
<div class="ember" style="left:12%; bottom:0; --drift: 17px;  --rise: -95vh;  --size: 4px; --color: #fbbf24; --dur: 2.7s; animation-delay: 1.7s;"></div>
<div class="ember" style="left:48%; bottom:0; --drift: -21px; --rise: -85vh;  --size: 3px; --color: #f97316; --dur: 3.1s; animation-delay: 2.2s;"></div>
<div class="ember" style="left:73%; bottom:0; --drift: 14px;  --rise: -70vh;  --size: 5px; --color: #ef4444; --dur: 2.4s; animation-delay: 0.9s;"></div>
<div class="ember" style="left:91%; bottom:0; --drift: -18px; --rise: -100vh; --size: 3px; --color: #fbbf24; --dur: 3.6s; animation-delay: 1.5s;"></div>



<!-- Fliege rechts -->
<img
    src="images/homefly.png"
    class="absolute right-0 pointer-events-none object-cover transition-opacity duration-300"
    [style.opacity]="selectedCharacter === 'ant' ? '0.15' : selectedCharacter === 'fly' ? '0.9' : '0.4'"


    style="height: 90%; bottom: -5%;"
/>

    <!-- Title -->
    <h1 class="font-ranchers text-8xl text-white mb-10 drop-shadow-lg">
        Ant VS Fly
    </h1>

    <!-- Name input -->
    <div class="mb-6 w-full max-w-sm">
        <input
            type="text"
            [(ngModel)]="playerName"
            placeholder="Your name..."
            class="w-full px-6 py-4 rounded-xl text-gray-900 text-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
    </div>

    <!-- Character selection -->
    <p class="text-gray-400 text-sm mb-3 uppercase tracking-widest">Choose your character</p>
    <div class="flex gap-6 mb-8">
        <button
            type="button"
            (click)="selectCharacter('ant')"
            [class]="selectedCharacter === 'ant'
                ? 'flex flex-col items-center p-4 rounded-xl bg-blue-500 scale-110 transition-all'
                : 'flex flex-col items-center p-4 rounded-xl bg-gray-700 hover:bg-gray-600 transition-all'">
            <img src="images/ant-svgrepo-com.svg" alt="Ant" class="w-16 h-16"/>
            <span class="text-white text-sm mt-2">Ant</span>
        </button>

        <button
            type="button"
            (click)="selectCharacter('fly')"
            [class]="selectedCharacter === 'fly'
                ? 'flex flex-col items-center p-4 rounded-xl bg-blue-500 scale-110 transition-all'
                : 'flex flex-col items-center p-4 rounded-xl bg-gray-700 hover:bg-gray-600 transition-all'">
            <img src="images/fly-svgrepo-com.svg" alt="Fly" class="w-16 h-16"/>
            <span class="text-white text-sm mt-2">Fly</span>
        </button>
    </div>

    <!-- Create Room -->
    <div class="w-full max-w-sm mb-6">
        <button
            type="button"
            (click)="createRoom()"
            class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xl font-semibold transition-all">
            Create Room
        </button>
    </div>

    <!-- Divider -->
    <div class="flex items-center w-full max-w-sm mb-6">
        <div class="flex-1 h-px bg-gray-600"></div>
        <span class="text-gray-400 px-4 text-sm uppercase tracking-widest">or</span>
        <div class="flex-1 h-px bg-gray-600"></div>
    </div>

    <!-- Join Room -->
    <div class="w-full max-w-sm flex flex-col gap-3">
        <input
            type="text"
            [(ngModel)]="roomCode"
            placeholder="Enter room code..."
            class="w-full px-6 py-4 rounded-xl text-gray-900 text-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
            type="button"
            (click)="joinRoom()"
            class="w-full py-4 rounded-xl bg-gray-700 hover:bg-gray-600 text-white text-xl font-semibold transition-all">
            Join Room
        </button>
    </div>

</main>
